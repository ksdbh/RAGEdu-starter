name: Preview tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pytest -q
      - name: Frontend install, test, types, and build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
      - name: Smoke test API and frontend proxy
        run: |
          set -euo pipefail
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          backend_pid=$!
          (cd frontend && npm run start -- --hostname 127.0.0.1) > /tmp/frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/backend/health; then break; fi
            sleep 1
          done
          bash backend/scripts/e2e_smoke.sh
          BASE_URL=http://127.0.0.1:3000/api/backend bash backend/scripts/e2e_smoke.sh
      - name: Logs on failure
        if: failure()
        run: cat /tmp/backend.log /tmp/frontend.log 2>/dev/null || true
